name: DRPEvals
physics_engine: 'physx'

headless: False #True

env:
  numEnvs: 128 #256
  envSpacing: 1.5
  episodeLength: 200 #1000
  enableDebugVis: True

  asset:
    data_set_path: "/home/avenger/Projects/drp/drp_eval/IsaacGymEnvs/assets/drp/hybrid1000.hdf5"
    obstacle_spawner_cfg: "/home/avenger/Projects/drp/drp_eval/IsaacGymEnvs/isaacgymenvs/obstacle_spawner/obstacle_spanwer_cfg/test_config.yaml"

  numObservations: 7
  numActions: 7


sim:
  dt: 0.01667 # 1/60
  substeps: 1
  up_axis: "z"
  use_gpu_pipeline: True
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: 4
    solver_type: 1
    use_gpu: True
    num_position_iterations: 8
    num_velocity_iterations: 1
    contact_offset: 0.005
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 1048576 # 1024*1024
    num_subscenes: 4
    contact_collection: 1

task:
  randomize: False
