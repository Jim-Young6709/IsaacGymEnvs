name: DRPEvals
physics_engine: 'physx'

headless: False

env:
  numEnvs: 100
  envSpacing: 1.5
  episodeLength: 500 #1000
  enableDebugVis: True
  numObservations: 7
  numActions: 7

sim:
  dt: 0.01667 # 1/60
  substeps: 1
  up_axis: "z"
  use_gpu_pipeline: True
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: 4
    solver_type: 1
    use_gpu: True
    num_position_iterations: 8
    num_velocity_iterations: 1
    contact_offset: 0.005
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 1048576 # 1024*1024
    num_subscenes: 4
    contact_collection: 1

task:
  randomize: False
  close_loop: True

  # "DRP", "Curobo", "Curobo_PCD"
  planner: "Curobo"
  use_artificial_potential: False

  # "static", "quasi_dynamic", "goal_blocker", "floating"

  task_type: "static"
  task_name: "static_box_tf"

  # task_type: "quasi_dynamic"
  # task_name: "level_0"

  # task_type: "floating"
  # task_name: "level_1"




hydra:
  output_subdir: null
  run:
    dir: .