# Final distillation env config

defaults:
  - DexMobileExpBase

name: FrankaLEAPMobilePickFull

cfg_override: "" # TopdownTable, TopdownConstrained, SideTable, SideConstrained

# if given, will override the device setting in gym. 
env:
  scene:
    hdf5_path: "./static_scenes/2box100.hdf5"
    batch_idx: 0
    safety_box_tol: 0.1 # in meters, when object is randomly sampled in the safety box region, keep it at certain distance from the region boundaries

  robot_init:
    # TODO: need to ensure the object is visible in initial camera frame, shift y by 0.3 according to vision arm location, also largely decrease ori rand
    base_init_range: [[-1.0, -0.25, -0.3], [-0.2, 0.25, 0.3]] # [[-0.2, 0.0, 0.0], [-0.2, 0.0, 0.0]] # x, y, yaw
    switch_pos_offset: [0.0, 0.0, 0.3] # override [shelf]
    switch_tol: 0.2 # override [shelf]

  distractor_settings:
    params:
      skip_prob: 1.0 # in full env all the distractors are actually loaded as obstacles, so only need to add the ground

  # no reset noise cause we are loading presampled init poses
  resetNoiseScale:
    leap: 0.5
    franka: 0.2 # joint angle
    arx: 0.2 # joint angle

  numObservations: 61 # 49, 61
  numStates: 106 # 94, 106
  numActions: 22 # delta eef actions 6 (xyz, rpy) + normalized hand joint actions 16

pcd_spec:
  num_static_points: 20480
  num_robot_points: 10240
  num_object_points: 5120
  num_distractor_points: 20480
  simulate_sensor_pcd: True

fabric:
  enable: True

reward:
  params:
    target_pos: [0.5, 0.0, 0.3]
    target_lift_dis: 0.3
    target_quat: [1.0, 0.0, 0.0, 0.0] # override [shelf]
    curl_reaching_threshold: 0.15

  exp:
    beta_hand_object: 5.0
    beta_object_goal: 5.0
    beta_object_drag: 10.0
    beta_lift: 0.0 # set this to 0 to use a 0-1 lift reward
    beta_curl: 0.05

  weights:
    w_hand_obj: 1.0
    w_obj_goal: 4.0
    w_obj_drag: 0.0
    w_lift: 2.0
    w_curl: 0.5
    w_colli: -1.0
    w_actionreg: -0.001

  actionreg_type: "" # "delta_joint_action", "delta_eef_action", "delta_qd"
