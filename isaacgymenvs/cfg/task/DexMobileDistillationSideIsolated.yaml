# Top-down box grasping config for Franka+LEAP environment

defaults:
  - DexMobileExpBase_Side # CODEX: use the copied side-only base config stack.

name: FrankaLEAPMobileDistillationPickSideIsolated # CODEX: register this as a separate task from dex envs.

# if given, will override the device setting in gym.
env:
  scene:
    table_size_range: [[0.5, 0.6, 0.05], [0.7, 1.2, 0.05]] # [[0.5, 0.6, 0.01], [0.7, 1.2, 0.1]]
    z_shift_range: [0.4, 0.8]  #[0.01, 0.8]
    teacher_bank_height_bins: 0
    teacher_bank_variation_json: null
    teacher_bank_height_assignment_json: null
  teacher_obs_action_frame: "eef"
  rl_reference_table_surface_height: 0.175
  object_settings:
    object_grasp_target_z_scale: 0.25 # @ray z scale for the hand-object reward, special for side grasp
    robot_side_x_margin: 0.1
    xyz_range: [[0.25, -0.2, 0.2], [0.55, 0.2, 0.25]] # [[0.45, -0.3, 0.2], [0.55, 0.3, 0.25]]  # xy is center position, z is BOTTOM height
  robot_init:
    base_init_range: [[-0.4, -0.2, -0.08], [-1.0, 0.2, 0.08]] #[[-0.4, -0.2, -0.08], [-1.0, 0.2, 0.08]] # [[-1.0, -0.2, -0.08], [-0.2, -0.2, 0.08]] # x, y, yaw
    resample_base_each_reset: True
    switch_pos_offset: [0.0, 0.0, 0.2]
    switch_tol: 0.1 # 0.05

  actionScale: # note this will multiply sim.dt
    # used for wbc policies
    leap: 3.0 # used for leap hands all the time
    franka: 0.6 # joint angle (mainly used in wbc distillation code)
    arx: 0.6 # joint angle (mainly used in wbc distillation code)
    # used for local policies (RL & local policy distillation)
    eef_pos: 0.6
    eef_rot: 0.6 # axis-angle rotation

  object_teleport:
    # @ray teleport checker is not only triggered at object_reset but every step
    # @ray to reduce cost, a global Bernoulli based on n0, n1, n2 is used
    enable: True
    env_proportion: 0.5 # proportion of envs to apply teleportation
    swap_frequency: 1
    curri_steps: 1
    n0: 20 # within n0 steps, don't teleport
    n1: 105 # until n1 steps, the probability of teleporting sum up to 0.5
    n2: 105 # keep ramp disabled; cycle resets after the flat schedule

    # @ray we teleport a distaence away from eef to avoid penetration
    min_xy_dist_to_eef: 0.05 # minimum XY distance from current eef for sampled object reset/teleport pose
    min_xy_dist_resample_rounds: 12
    force_right_of_eef: False

  numObservations: 60
  numStates: 105
  numActions: 22 # delta eef actions 6 (xyz, rpy) + normalized hand joint actions 16

  eef_init:
    target_quat_noise_deg: 10
    pitch_roll_noise_deg: 45.0
    dir_candidates_per_env: 5
    side_mode: left

    upright_near_table_recovery_prob: 0.0
    upright_near_table_base_init_range: [[-0.2, -0.4, -0.08], [-0.4, 0.2, 0.08]]
    upright_near_table_palm_rel_object_min: [-0.24, -0.24, 0.0]
    upright_near_table_palm_rel_object_max: [0.24, 0.24, 0.18]
    upright_near_table_far_recovery_prob: 0.0
    upright_near_table_palm_rel_object_far_min: [-0.40, -0.40, 0.0]
    upright_near_table_palm_rel_object_far_max: [0.40, 0.40, 0.3]
    upright_near_table_palm_rel_base_min: [0.20, -0.35, 0.02]
    upright_near_table_palm_rel_base_max: [0.65, 0.35, 0.16]
    upright_near_table_min_palm_object_dist: 0.05
    upright_near_table_max_resample_attempts: 32
    upright_near_table_bank_size: 128
    upright_near_table_bank_max_ik_goals: 2048

  fabric_switch:
    mode: simple_anchor # staged | simple_anchor
    lateral_offset: 0.2
    high_z_offset: 0.2
    high_z_tol: 0.05
    stage3_z_offset: 0.025
    stage2_xy_tol: 0.1
    stage3_xy_tol: 0.1
    stage3_xy_tol_exit: 0.13
    object_xy_tol_exit: 0.23
    teacher_activate_z_offset: 0.075
    flat_table_reset_steps: 1
    bad_state_xy_margin: 0.05

    simple_lateral_offset: 0.15
    simple_high_z_offset: 0.2
    simple_high_z_tol: 0.05
    simple_activate_radius: 0.25
    simple_activate_radius_exit: 0.28
    simple_teacher_activate_z_offset: 0.075

  verified_teacher_bank:
    enable: False
    hdf5_path: ./teacher_state_banks/side_verified_teacher_states.hdf5
    capacity_per_env: 8 # collection target per shared variation; also the local per-rank storage cap
    correct_region_margin: 0.03
    collection_region_filter: all # options: all, correct_only, wrong_only
    far_recovery_hand_noise_scale: 1.0
    far_recovery_hand_bank_size: 1024
    far_recovery_hand_bank_candidate_batch_size: 256
    far_recovery_hand_bank_max_rounds: 64
    far_recovery_hand_bank_points_per_link: 24
    far_recovery_hand_bank_min_link_distance: 0.004
    sampling_probs:
      afar: 0.4
      near_recovery: 0.3
      far_recovery: 0.3
  activation_snapshot_bank:
    enable: False
    hdf5_path: ./teacher_state_banks/side_activation_snapshots.hdf5
    capacity_per_env: 64 # local per-rank snapshot cap per env slot before repack by variation

sim:
  physx:
    num_position_iterations: 32 #48 #16
    num_velocity_iterations: 4 #1
    contact_offset: 0.005 # CODEX: merged duplicate sim block for OmegaConf rank-local task loading.

fabric:
  enable: True

observation:
  usage:
    use_z: True
    use_xy: True

reward:
  params:
    target_pos: [0.5, 0.0, 0.55]
    target_pos_noise: [0.1, 0.1, 0.2]
    target_pos_after_lift_base: [0.75, 0.0, 0.65]
    target_pos_after_lift_z_from_table: 0.35
    target_lift_dis: 0.1
    target_quat_right: [-0.7071067811865475, 0.0, 0.0, 0.7071067811865476]
    target_quat_left: [0.7071067811865475, 0.0, 0.0, 0.7071067811865476]
    grasp_on_object_z_height_tolerance: [0.005, 0.01]
    grasp_on_object_z_height_slope: 3000
    grasp_on_object_z_height_offset: 0.05
    grasp_on_object_z_height_gate_floor: 0.1
    grasp_on_object_z_height_gate_enabled: True
    curl_reaching_threshold: 0.15
    success_tolerance: 0.1
    success_timeout_steps: 50 # CODEX: side distillation latches success after sustained success.
    lifting_timeout_steps: 50 # CODEX: keep lifting latch duration aligned with success timeout.

  exp:
    beta_hand_object: 5.0
    beta_object_goal: 5.0
    beta_hand_orientation: 5.0
    beta_lift: 0.0 # set this to 0 to use a 0-1 lift reward
    beta_curl: 0.05

  weights:
    w_hand_obj: 1.0
    w_obj_goal: 4.0
    w_hand_orientation: 2.0
    w_lift: 2.0
    w_curl: 0.5
    w_colli: -1.0
    w_actionreg: -0.001

  actionreg_type: "" # "delta_joint_action", "delta_eef_action", "delta_qd"
