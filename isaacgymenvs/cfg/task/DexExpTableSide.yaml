# Tabletop grasping config for Franka+LEAP environment

defaults:
  - LEAPExpBase

name: FrankaLEAPPickTableSide

# if given, will override the device setting in gym. 
env:
  numObservations: 60
  numStates: 105
  numActions: 22 # delta eef actions 6 (xyz, rpy) + normalized hand joint actions 16

  scene:
    table_surface_height: 0.175 # fixed table surface height relative to the robot base

  object_settings:
    xyz_range: [[0.3792, -0.3011, 0.2], [0.7, -0.1253, 0.25]] # [[0.3792, -0.5011, 0.2], [0.5848, -0.1253, 0.25]] # canonical left-side bank region; right side is mirrored in reset sampling
    mirror_y_prob: 0.5
    flat_xyz_range: [[0.3792, -0.4, 0.2], [0.7, 0.4, 0.25]]
    flat_mirror_y_prob: 0.0
    table_y_margin: 0.05 # top-long teleport/reset-style sampling margin from table y edges
    robot_side_x_margin: 0.0 # optional top-long margin from the robot-side table x edge
    object_grasp_target_z_scale: 0.25 # @ray z scale for the hand-object reward, special for side grasp
    lie_flat_prob: 0.0
  object_teleport:
    enable: False
    mode: schedule
    preserve_orientation: False # top-long teleport: preserve existing flat yaw if True, else resample yaw
    top_long_match_distillation: True # for lie_flat_prob=1.0, use distillation top-long teleport schedule/geometry
    env_proportion: 1.0
    swap_frequency: 1
    curri_steps: 1
    n0: 20
    n1: 105
    n2: 105
    min_xy_dist_to_eef: 0.05
    min_xy_dist_to_hand_points: 0.05
    min_xy_dist_resample_rounds: 12
    force_right_of_eef: False
    success_curriculum:
      enable: False
      success_threshold: 0.85
      success_steps: 500
      num_increments: 10
      start_stage: 1
  reset_bank:
    size: 4096
    max_ik_goals: 4096
  eef_init:
    side_mode: both
    flat_side_recovery_prob: 0.0 # for lie_flat resets: fraction that use side-style eef/base init instead of pure top-down init
    wrong_side_curriculum:
      enable: True
      success_threshold: 0.85
      success_steps: 500
      num_increments: 10
      start_stage: 0
      max_prob: 0.5
    yaw_noise_deg: 45.0
    pitch_roll_noise_deg: 45.0
    rel_object_min: [-0.3, -0.3, 0.0282] # [-0.1178, 0.05, 0.0282]
    rel_object_max: [0.3, 0.3, 0.3490]

    flat_rel_object_min: [-0.08, -0.08, 0.16]
    flat_rel_object_max: [0.08, 0.08, 0.32]
    flat_topdown_rel_object_min: [-0.4, -0.4, 0.10]
    flat_topdown_rel_object_max: [0.4, 0.4, 0.45]

observation:
  usage:
    use_z: True
    use_xy: True

reward:
  params:
    target_pos: [0.5, 0.0, 0.55] # @ray note that xy is no longer used and is inferred from object xy
    target_pos_noise: [0.1, 0.1, 0.1]
    target_lift_dis: 0.1
    target_quat_right: [-0.7071067811865475, 0.0, 0.0, 0.7071067811865476]
    target_quat_left: [0.7071067811865475, 0.0, 0.0, 0.7071067811865476]
    target_quat_flat: [1.0, 0.0, 0.0, 0.0]
    curl_reaching_threshold: 0.15
    hand_grasp_dir_local: [0.0, 1.0, 0.0]
    orientation_reward_mode: old_targetquat # old_targetquat | canonical_axis | object_axis
    object_upright_reward_floor: 0.3 # only used when orientation_reward_mode=object_axis
    goal_align_gate_floor: 0.2
    goal_align_gate_full_reward: 0.5 # alignment gate saturates to 1.0 once r_goal_align reaches this
    hand_obj_align_gate_for_side: False # if true, normal side hand-object reward is multiplied by the alignment gate
    object_knockdown_penalty_enable: False
    object_knockdown_flat_angle_deg: 30.0 # normal side only; penalize when object local z is within this angle of the table plane
    object_knockdown_penalty: 1.0
    grasp_side_split_y_offset: 0.03
    wrong_side_proximity_threshold: 0.05
    wrong_side_proximity_penalty: 1.0
    wrong_side_logic_for_flat_objects: False
    wrong_side_forbidden_box_enable: True
    wrong_side_forbidden_box_side_only: True
    wrong_side_forbidden_box_flat_axis_z_abs_max: 0.5
    flat_object_axis_z_abs_max: 0.5

    hand_obj_use_midheight_xy: False
    hand_obj_midheight_height_weight: 1.0
    hand_obj_gate_floor: 0.2
    hand_obj_gate_success_curriculum:
      enable: True
      success_threshold: 0.85
      success_steps: 500
      num_increments: 10
      start_stage: 1
    success_bonus_threshold: 0.05
    resample_target_on_success: False

  exp:
    beta_hand_object: 6.0
    beta_object_goal: 5.0
    beta_goal_align: 5.0
    beta_recovery_region: 2.0
    beta_hand_orientation: 4.0
    beta_lift: 0.0 # set this to 0 to use a 0-1 lift reward
    beta_curl: 0.05

  weights:
    w_hand_obj: 1.0
    w_obj_goal: 4.0
    w_goal_align: 0.2
    w_recovery_region: 0.2
    w_hand_orientation: 2.0
    w_lift: 2.0
    w_curl: 0.5
    w_success_bonus: 1.0
    w_actionreg: -0.001

  actionreg_type: "" # "delta_joint_action", "delta_eef_action", "delta_qd"
