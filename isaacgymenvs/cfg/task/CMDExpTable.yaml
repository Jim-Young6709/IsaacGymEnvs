# Tabletop grasping config for Franka+CMD environment

defaults:
  - LEAPExpBase

name: FrankaCMDPickTable

# if given, will override the device setting in gym. 
env:
  actionScale:
    hand: 3.0

  asset:
    assetRoot: "../../assets"
    assetFileNameFranka: "franka_cmd/franka_cmd_left.urdf"

  resetNoiseScale:
    hand: 0.2
    arm: 0.2 # joint angle

  numObservations: 50
  numStates: 93
  numActions: 20 # delta eef actions 6 (xyz, rpy) + normalized hand joint actions 14

reward:
  params:
    target_pos: [0.5, 0.0, 0.3]
    target_lift_dis: 0.1
    target_quat: [0.0, 0.0, 0.707, 0.707]
    curl_reaching_threshold: 0.15

  exp:
    beta_hand_object: 5.0
    beta_object_goal: 5.0
    beta_lift: 0.0 # set this to 0 to use a 0-1 lift reward
    beta_curl: 0.05

  weights:
    w_hand_obj: 1.0
    w_obj_goal: 4.0
    w_lift: 2.0
    w_curl: 0.5
