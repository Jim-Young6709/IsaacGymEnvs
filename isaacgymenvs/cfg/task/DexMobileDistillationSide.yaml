# Top-down box grasping config for Franka+LEAP environment

defaults:
  - DexMobileExpBase

name: FrankaLEAPMobileDistillationPickSide

# if given, will override the device setting in gym. 
env:
  scene:
    table_size_range: [[0.5, 0.6, 0.01], [0.7, 1.2, 0.1]]
    z_shift_range: [0.01, 0.8]
  
  object_settings:
    object_grasp_target_z_scale: 0.01 # @ray z scale for the hand-object reward, special for side grasp

  robot_init:
    # TODO: need to ensure the object is visible in initial camera frame, shift y by 0.3 according to vision arm location, also largely decrease ori rand
    base_init_range: [[-1.0, -0.25, -0.3], [-0.2, 0.25, 0.3]] # [[-0.2, 0.0, 0.0], [-0.2, 0.0, 0.0]] # x, y, yaw
    switch_pos_offset: [0.0, 0.0, 0.2]
    switch_tol: 0.2

  numObservations: 49
  numStates: 94
  numActions: 22 # delta eef actions 6 (xyz, rpy) + normalized hand joint actions 16

fabric:
  enable: True

observation:
  usage:
    use_z: True
    use_xy: True

reward:
  params:
    target_pos: [0.5, 0.0, 0.3]
    target_lift_dis: 0.1
    target_quat_right: [-0.7071067811865475, 0.0, 0.0, 0.7071067811865476]
    target_quat_left: [0.7071067811865475, 0.0, 0.0, 0.7071067811865476]
    grasp_on_object_z_height_tolerance: [0.05, 0.2]
    grasp_on_object_z_height_scale: 80.
    curl_reaching_threshold: 0.15

  exp:
    beta_hand_object: 5.0
    beta_object_goal: 5.0
    beta_hand_orientation: 5.0
    beta_lift: 0.0 # set this to 0 to use a 0-1 lift reward
    beta_curl: 0.05

  weights:
    w_hand_obj: 1.0
    w_obj_goal: 4.0
    w_hand_orientation: 2.0
    w_lift: 2.0
    w_curl: 0.5
    w_actionreg: -0.001

  actionreg_type: "" # "delta_joint_action", "delta_eef_action", "delta_qd"
