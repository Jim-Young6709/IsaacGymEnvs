# Top-down box grasping config for Franka+LEAP environment

defaults:
  - DexMobileExpBase

name: FrankaLEAPMobilePickTopFull

# if given, will override the device setting in gym. 
env:
  scene:
    table_thickness_range: [0.01, 0.1]
    z_shift_range: [0.1, 0.7]

    add_on_obstacles:
      cuboids:
        num: 10
        size_xy: [[0.05, 0.05], [0.1, 0.1]]
        size_z_min: 0.1
      spheres:
        num: 0 # 1
        r_min: 0.05
      capsules:
        num: 10 # currently don't have this supported in pcd utils
        r_min: 0.025
        l_min: 0.025 # this is semi-length of the cylindrical part

    mobile_obstacles:
      x_offset_range: [-0.4, -0.2]
      y_offset_range: [0.2, 0.5]
      cuboids:
        num: 0 # 1
        size_range: [[0.15, 0.15, 0.4], [0.25, 0.25, 0.6]]
      capsules:
        num: 0 # 1
        size_range: [[0.1, 0.4], [0.15, 0.6]] # radius & entire height of the capsule

    safety_box:
      wall_thickness: 0.01
      # size: [[0.25, 0.25, 0.15], [0.5, 0.5, 0.25]] # x, y, z
      size: [[0.35, 0.35, 0.1], [0.5, 0.5, 0.2]] # x, y, z
      x_shift_range: [0.3, 0.7]
      y_shift_range: [-0.3, 0.3]
      z: [-0.2, 0.5]
      r: [0.2, 0.4] # rot_ex radius
      rot_in: [-0.4, 0.4] # radians
      rot_ex: [-1.5, 1.5] # radians
      obj_wall_tol: 0.05
      colli_reset: False
      corner_obstacles_range: [2, 3] # [4, 6] # low & high inclusive
      extra_surrounding_obstacles_range: [2, 3] # [4, 6] # low & high inclusive
      shift_other_obstacles_range: [0.1, 0.2]

  object_settings:
    object_grasp_target_z_scale: 0.4
    lie_flat_prob: 1.0

  robot_init:
    # TODO: need to ensure the object is visible in initial camera frame, shift y by 0.3 according to vision arm location, also largely decrease ori rand
    base_init_range: [[-1.0, -0.25, -0.3], [-0.2, 0.25, 0.3]] # [[-0.2, 0.0, 0.0], [-0.2, 0.0, 0.0]] # x, y, yaw
    switch_pos_offset: [0.0, 0.0, 0.2]
    switch_tol: 0.2

  object_teleport:
    enable: True
    mode: fixed_prob
    preserve_orientation: False
    env_proportion: 0.3
    per_env_prob: 0.0035714285714285713
    curri_steps: 20000
    swap_freq: 3
    n0: 10
    n1: 150
    n2: 100
    min_xy_dist_resample_rounds: 12
    success_curriculum:
      enable: True
      success_threshold: 0.85
      success_steps: 500
      num_increments: 10
      start_stage: 1

  eef_init:
    enable: True
    dis_open_range: [0.3, 0.35]
    dis_side_range: -0.1

  numObservations: 61
  numStates: 106
  numActions: 22 # delta eef actions 6 (xyz, rpy) + normalized hand joint actions 16

fabric:
  enable: True

reward:
  params:
    target_pos: [0.5, 0.0, 0.3]
    target_pos_after_lift_base: [0.5, 0.0, 0.3]
    target_pos_after_lift_z_from_table: 0.3
    target_pos_after_lift_noise: [0.1, 0.1, 0.0]
    target_lift_dis: 0.1
    target_quat: [1.0, 0.0, 0.0, 0.0]
    curl_reaching_threshold: 0.15
    resample_target_on_success: False

  exp:
    beta_hand_object: 5.0
    beta_object_goal: 5.0
    beta_object_drag: 10.0
    beta_lift: 0.0 # set this to 0 to use a 0-1 lift reward
    beta_curl: 0.05

  weights:
    w_hand_obj: 1.0
    w_obj_goal: 4.0
    w_obj_drag: 0.0
    w_lift: 2.0
    w_curl: 0.5
    w_colli: -1.0
    w_actionreg: -0.001

  actionreg_type: "" # "delta_joint_action", "delta_eef_action", "delta_qd"
