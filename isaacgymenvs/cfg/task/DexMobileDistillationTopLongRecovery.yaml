# Mobile distillation for top-long recovery states.
#
# This task mixes normal TopLong resets with side-failure resets where the
# object is already flat on the table, the base is closer to the table, and the
# hand starts in a side-grasp pose. Fabric first reorients the hand into a
# top-down pre-align pose, then hands off to the TopLong teacher.

defaults:
  - DexMobileDistillationTopLong

name: FrankaLEAPMobileDistillationPickTopLongRecovery

env:
  failure_recovery:
    enable: True
    prob: 0.80
    eef_rel_object_min: [-0.1178, 0.05, 0.0282]
    eef_rel_object_max: [0.2, 0.5, 0.3490]
    base_rel_eef_min: [-0.5523, 0.0161, -0.7124]
    base_rel_eef_max: [-0.3286, 0.3031, -0.1116]
    base_yaw_noise_deg: 10.0
    target_quat_right: [-0.7071067811865475, 0.0, 0.0, 0.7071067811865476]
    target_quat_left: [0.7071067811865475, 0.0, 0.0, 0.7071067811865476]
    pre_align_height_offset: 0.18
    reference_table_surface_height: 0.175
    max_attempts: 32
