# Base config for Franka+LEAP environment

physics_engine: ${..physics_engine}

# if given, will override the device setting in gym.
env:
  numEnvs: ${resolve_default:1024,${...num_envs}}
  envSpacing: 1.5
  episodeLength: 500
  enableDebugVis: False

  clipObservations: 5.0
  clipActions: 1.0

  aggregateMode: 3

  actionScale: # note this will multiply sim.dt
    # used for wbc policies
    leap: 3.0 # used for leap hands all the time
    franka: 0.6 # joint angle (mainly used in wbc distillation code)
    arx: 0.6 # joint angle (mainly used in wbc distillation code)
    # used for local policies (RL & local policy distillation)
    eef_pos: 0.6
    eef_rot: 0.6 # axis-angle rotation

  resetNoiseScale:
    leap: 0.5
    franka: 0.2 # joint angle
    arx: 0.2 # joint angle

  grasp_guide_idx: 1 # 0: original curl, 1: current side-grasp curl, 2: sparse/open curl, 3: new side-grasp curl
  grasp_mode: full # options: full, pinch2, pinch3

  controlType: joint_position  # options are {joint_position, osc}
  controlFrequencyInv: 1

  asset:
    assetRoot: "../../assets"
    assetFileNameFranka: "franka_hand/franka_leap.urdf"

  mesh:
    mesh_dir: "./meshes_69_new"
    obj_list: ["all"]
    variant_manifest_json: null # fixed dilated-variant manifest for distillation/data generation
    variant_preload_count: 0 # if >0, exact number of dilated variant assets to preload
    variant_preload_multiplier: 1 # used only when variant_preload_count is 0
    variant_preload_max: 0 # if >0, caps multiplier-based variant preloading

  table_thickness: 0.05

  object_settings:
    xyz_range: [[0.35, -0.2, 0.2], [0.55, 0.2, 0.25]] # xy is center position, z is BOTTOM height
    scale_range: [1.0, 1.0] # @ray this should match the scale in the urdf
    mass_range: [0.5, 0.5]
    object_center_z_scale: 0.5 # @ray normally just 1/2, but might be lower for side grasps
    apply_shape_offsets: False
    contact_offset: 0.02 # if set, overrides only the object asset contact offset
    rest_offset: 0.01 # if set, overrides only the object asset rest offset

  object_wrench:
    enable: True
    activation_dis: 0.15 # in meters (apply forces within this range / when object is lifted)
    activation_prob: 1.0 # Bernoulli probability of activating a new wrench on each trigger window
    max_linear_force: 5.0 # in Newtons
    torsional_radius: 0.01 # in meters
    trigger_duration: 1.0 # seconds, this will time sim_dt to get the number of trigger steps
    curri_steps: 1 # curriculum steps, now default to 1 which is no curri
    success_curriculum:
      enable: True # if true, overrides curri_steps with success-gated force scaling
      success_threshold: 0.85 # increment only while rolling episode success rate is above this
      success_steps: 500 # consecutive sim steps above threshold before each increment
      num_increments: 10 # force scale is stage / num_increments, from 0 to 1
      start_stage: 1
    horizontal_away_from_eef:
      enable: False
      force_range: [7.5, 12.5] # in Newtons, sampled in XY away from current EEF
    vertical_downward:
      enable: False
      force_range: [7.5, 12.0] # in Newtons, sampled in -Z in addition to the random wrench

  object_teleport:
    enable: True
    env_proportion: 0.5 # proportion of envs to apply teleportation
    mode: schedule # schedule | fixed_prob
    per_env_prob: 0.003 # only used when mode=fixed_prob
    curri_steps: 20000
    swap_freq: 3 # resample the cached teleport env subset after this many teleport events
    n0: 10 # within n0 steps, don't teleport
    n1: 150 # until n1 steps, the probability of teleporting sum up to 0.5
    n2: 100 # at n2 steps, the probability of teleporting is 1.0
    success_curriculum:
      enable: False # if true, overrides curri_steps with success-gated teleport scaling
      success_threshold: 0.85
      success_steps: 500
      num_increments: 10
      start_stage: 1

  distractor_settings:
    enable: False
    params:
      skip_prob: 0.3 # probability to skip adding distractors for a local region (under/side/behind the table)
      full_prob: 0.2 # probability to spawn a single large box that fully occupies the local distractor region
      table_extend: 0.5 # extended dims along table edges for distractors at the side/back
      free_space_distractor_max_height: 1.0 # max z_height for distractors in free space, note this is not the actual height
      num_distractors_per_region_range: [1, 4] # low & high inclusive
      cuboid_size_range: [[0.1, 0.1, 0.4], [0.4, 0.4, 0.8]]
      cylinder_size_range: [[0.1, 0.4], [0.2, 0.8]] # radius & height of the cylinder
      sphere_size_range: [0.1, 0.2]

  eef_init:
    enable: False
    limit_abad: False

  enable_vhacd: False

  # video logging
  video_logging:
    capture: False
    envs: 4
    freq: 30000 # @ray measured in sim steps

  # log per object success rate
  log_per_object_success:
    capture: False
    freq: 50000 # @ray measured in sim steps

  enable_viser: False

  # set to True if use camera sensors in the environment
  enableCameraSensors: ${task.env.video_logging.capture}

sim:
  dt: 0.01667 # 1/60
  substeps: 1
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}
    use_gpu: ${contains:"cuda",${....sim_device}} # set to False to run on CPU
    num_position_iterations: 32 #48 #16
    num_velocity_iterations: 4 #1
    contact_offset: 0.005
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 5.0
    max_gpu_contact_pairs: 4194304 # 1024*1024*4 @ray increased by 2x
    num_subscenes: ${....num_subscenes}
    contact_collection: 1 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (broken - do not use!)

fabric:
  enable: False
  gripper_pose_attractor: legacy # CODEX: side-isolated dex_compare keeps legacy fabric behavior by default.

reward:
  params:
    target_pos: [0.5, 0.0, 0.3]
    target_lift_dis: 0.1
    target_quat: [0.707, -0.707, 0.0, 0.0]
    matching_dis: 0.2
    curl_reaching_threshold: 0.15
    include_palm_in_hand_obj: True
    success_timeout: 2.0
    lifting_timeout: 2.0

  # @ray checks where the usage is
  usage:
    use_curl: True

  exp:
    beta_hand_object: 5.0
    beta_object_goal: 5.0
    beta_lift: 0.0 # set this to 0 to use a 0-1 lift reward
    beta_curl: 0.05

  weights:
    w_hand_obj: 1.0
    w_obj_goal: 4.0
    w_lift: 2.0
    w_curl: 0.5
    w_actionreg: -0.001

  actionreg_type: "" # "delta_joint_action", "delta_eef_action", "delta_qd"

pcd_spec:
  num_static_points: 1024
  num_robot_points: 1024
  num_object_points: 512
  num_distractor_points: 2048
  num_local_points: 512 # TODO: clean up later
  simulate_depth_cam: True
  depth_pcd_ratio: 0.5 # 0.5 depth pcd ; 0.5 lidar pcd

# Domain Randomization
task:
  randomize: False
  randomization_params:
    frequency: 720   # Define how many simulation steps between generating new randomizations
    schedule_steps_default: 200000
    observations:
      range: [0, .002] # range for the white noise
      range_correlated: [0, .001] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
      schedule: "linear"   # "constant" is to turn on noise after `schedule_steps` num steps
      schedule_steps: ${..schedule_steps_default}
    actions:
      range: [0., .05]
      range_correlated: [0, .015] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
      schedule: "linear"  # "linear" will linearly interpolate between no rand and max rand
      schedule_steps: ${..schedule_steps_default}
    sim_params:
      gravity:
        range: [0, 0.4]
        operation: "additive"
        distribution: "gaussian"
        schedule: "linear"  # "linear" will linearly interpolate between no rand and max rand
        schedule_steps: ${...schedule_steps_default}
    actor_params:
      franka:
        # color: True
        dof_properties:
          damping:
            range: [0.3, 3.0]
            operation: "scaling"
            distribution: "loguniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: ${.....schedule_steps_default}
          stiffness:
            range: [0.75, 1.5]
            operation: "scaling"
            distribution: "loguniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: ${.....schedule_steps_default}
          lower:
            range: [0, 0.01]
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: ${.....schedule_steps_default}
          upper:
            range: [0, 0.01]
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: ${.....schedule_steps_default}
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: ${.....schedule_steps_default}
      object:
        # color: True
        scale:
          range: [0.95, 1.05]
          operation: "scaling"
          distribution: "uniform"
          setup_only: True # Property will only be randomized once before simulation is started. See Domain Randomization Documentation for more info.
          schedule: "linear"  # "linear" will scale the current random sample by ``min(current num steps, schedule_steps) / schedule_steps`
          schedule_steps: ${....schedule_steps_default}
        rigid_body_properties:
          mass:
            range: [0.8, 1.2]
            operation: "scaling"
            distribution: "uniform"
            setup_only: True # Property will only be randomized once before simulation is started. See Domain Randomization Documentation for more info.
            schedule: "linear"  # "linear" will scale the current random sample by ``min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: ${.....schedule_steps_default}
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: ${.....schedule_steps_default}
      table: # table
        # color: True
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: ${.....schedule_steps_default}
